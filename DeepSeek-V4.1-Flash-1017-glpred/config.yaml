# Hermes Agent CLI Configuration
# Copy settings from this example into ~/.hermes/config.yaml, or use
# `hermes config set <section.key> <value>` to update the active profile.
# This file configures CLI behavior; only documented secret environment
# variables in .env take precedence over their corresponding settings.

# Schema version of this file. The installers copy it to seed config.yaml, and
# `hermes update` uses it to know which one-time migrations the file already
# has. Hermes manages it: do not copy it into another config.
_config_version: 51

# =============================================================================
# Database Configuration
# =============================================================================
# WAL is the normal default. Hermes automatically falls back to DELETE when
# SQLite reports that WAL is incompatible with the filesystem. Set this to
# "delete" explicitly for deployments whose backing filesystem is not WAL
# crash-safe, such as Linux containers bind-mounted through macOS virtiofs,
# NFS, or SMB. Hermes will not live-downgrade a database already open in WAL.
database:
  journal_mode: "wal"  # Supported values: "wal", "delete"
 
runtime:
  nofile_soft_limit: 4096

attachments:
  storage: "hermes-home"

# =============================================================================
# Plugin Installation
# =============================================================================
plugins:
  # Deadline for each Git clone, fetch or checkout during plugin install. Default: 300
  # seconds. Subdirectory installs download only that folder.
  # Raise this for large repositories or slow connections. Maximum: 3600.
  clone_timeout_seconds: 300

# =============================================================================
# Model Configuration
# =============================================================================
model:
  # Default model to use (can be overridden with --model flag)
  # Both "default" and "model" work as the key name here.
  # default: "Ternary-Bonsai-2-27B-PTQ1_0.gguf"
  provider: deepseek
  default: "deepseek-flash"

  api_mode: chat_completions
kanban:
  review_dispatch: true

cron:
  catch_up_missed: true  # False skips past-grace recurring misses after planned downtime.

terminal:
  backend: "local"
  cwd: "."  # For local backend: "." = current directory. Ignored for remote backends unless a backend documents otherwise.
  # Desktop xterm font. Install the font locally; Nerd Fonts render Powerlevel10k glyphs.
  # font_family: "MesloLGS NF"  # Also accepts a CSS stack; blank uses bundled JetBrains Mono.
  timeout: 90
  # HOME policy for tool subprocesses:
  #   auto    - default: host uses your real HOME; containers use HERMES_HOME/home
  #   real    - force your real OS-user HOME
  #   profile - force HERMES_HOME/home for strict per-profile CLI config isolation
  home_mode: "auto"
  docker_mount_cwd_to_workspace: false  # SECURITY: off by default. Opt in to mount the launch cwd into Docker /workspace.
  lifetime_seconds: 300
  # sudo_password: "hunter2"  # Optional: pipe a sudo password via sudo -S. SECURITY WARNING: plaintext.
  # sudo_password: ""         # Explicit empty password: try empty and never open the interactive sudo prompt.

  container_cpu: 1              # CPU cores
  container_memory: 5120        # Memory in MB (5120 = 5GB)
  container_disk: 51200         # Disk in MB (51200 = 50GB)
  container_persistent: true    # Persist filesystem across sessions (false = ephemeral)

browser:
  # Inactivity timeout in seconds - browser sessions are automatically closed
  # after this period of no activity between agent loops (default: 120 = 2 minutes)
  inactivity_timeout: 120
  # Let an authenticated browser extension register as the controller for an
  # existing Hermes session. Disabled by default. Local API registration also
  # requires the API server bearer key to be configured.
  extension_control:
    enabled: false

  # Maximum characters of snapshot content before truncate-and-store.
  # Increase for long pages (for example, documentation or financial reports),
  # or decrease to reduce context usage. Minimum: 1000; default: 15000
  # (same per-page budget as web_extract).
  # snapshot_threshold: 15000

  # JavaScript evaluation guardrails (both default false). restrict_evaluate
  # opts into a denylist that blocks sensitive primitives (cookies, storage,
  # clipboard, network, form values) in browser_console(expression=...) — use
  # it when the agent drives a logged-in profile. allow_unsafe_evaluate is the
  # legacy override that switches the denylist back off even when restrict is on.
  # restrict_evaluate: false
  # allow_unsafe_evaluate: false

# =============================================================================
# Tool Loop Guardrails
# =============================================================================
# Soft warnings are enabled by default. They append guidance to repeated failed
# or non-progressing tool results but still let the tool execute. Hard stops stay
# opt-in for interactive CLI/TUI/Desktop/ACP sessions, but default on for unattended
# gateway/cron sessions where nobody is present to interrupt a model that
# ignores loop warnings.
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5

compression:
  # Enable automatic context compression (default: true)
  # Set to false if you prefer to manage context manually or want errors on overflow
  enabled: true

  checkpoint_required: false

  # Opt-in compression progress notices on chat platforms (default: false).
  # By design, routine automatic compression is SILENT on human-facing chat
  # gateways (Telegram, Discord, Slack, ...) — it happens in the background
  # with server-side logging only. Set true to also deliver the routine
  # progress statuses (compacting started, preflight/pre-API compression,
  # idle compaction, retry progress, and the compaction-complete notice) to
  # chat platforms. Unrelated operational noise (auxiliary model failures,
  # provider retry chatter) stays suppressed either way, and compression
  # FAILURE notices + manual /compress feedback are always visible
  # regardless of this setting. (#52995)
  progress_notices: false

  # Trigger compression at this % of model's context limit (default: 0.50 = 50%)
  # Lower values = more aggressive compression, higher values = compress later
  # Models with context windows below 512K are floored at 0.75 (raise-only) so
  # compaction doesn't fire with half the window still free; set above 0.75 to override.
  threshold: 0.4

  codex_gpt55_autoraise: true

  # Fraction of the threshold to preserve as recent tail (default: 0.20 = 20%)
  # e.g. 20% of 50% threshold = 10% of total context kept as recent messages.
  # Summary output is separately capped at 12K tokens (Gemini output limit).
  # Range: 0.10 - 0.80
  target_ratio: 0.20

  # Number of most-recent messages to always preserve (default: 20 ≈ 10 full turns)
  # Higher values keep more recent conversation intact at the cost of more aggressive
  # compression of older turns.
  protect_last_n: 20

  # Minimum number of REAL (actionable) user messages guaranteed to survive in
  # the uncompressed tail (default: 1 = the existing single last-user anchor,
  # behavior-preserving). Raise to e.g. 3 to keep the last 3 real user turns
  # verbatim even when bulky tool outputs fill the tail token budget — blank
  # platform echoes, compaction handoffs, and synthetic continuation rows never
  # count toward N. The tail can exceed the token budget when this pulls the
  # cut back; the guarantee wins over the budget by design.
  min_tail_user_messages: 1

  # Compression retry rounds before a turn gives up with "max compression
  # attempts reached" (default: 3, same as the previous hardcoded value).
  # Raise (e.g. 6) for tool-schema-heavy sessions where 3 rounds cannot bring
  # the request estimate under the threshold. Validated >= 1, hard cap 10.
  max_attempts: 3

  # Codex app-server (codex CLI runtime) thread-compaction mode. The codex
  # agent owns the real thread context on this runtime, so Hermes' summarizer
  # cannot shrink it — compaction goes through the app server instead.
  #   native = let Codex decide when to compact its own thread (default)
  #   hermes = let Hermes threshold trigger Codex thread/compact/start
  #   off    = Hermes will not auto-trigger compaction; Codex may still compact natively
  codex_app_server_auto: native

  # Native OpenAI Responses server-side compaction (default: false). When true,
  # gpt-5.6-family models on the DIRECT OpenAI API (api.openai.com) or a ChatGPT
  # Codex subscription, plus gpt-6-astra (and its -900k alias) on official Codex OAuth, compact
  # server-side: OpenAI prunes older context into an
  # encrypted checkpoint that Hermes replays on later turns. No other provider,
  # route, or model is affected. Hermes' local compression stays armed as the
  # fallback and still handles every non-eligible session.
  codex_responses_native: false

  # Optional absolute server compaction trigger in input tokens. The default
  # null value follows the resolved local compression trigger with an 8192 token
  # safety margin. For example, a local trigger of 765000 selects 756808.
  # A positive integer stays absolute and only clamps downward when needed so
  # the server compacts first. Invalid values use this automatic behavior. If
  # the local trigger is unavailable, automatic mode uses 200000.
  codex_responses_compact_threshold:

  # Number of non-system messages to protect at the head of the transcript, in
  # ADDITION to the system prompt (which is always implicitly protected).
  # Head messages are NEVER summarized — they survive every compression
  # indefinitely. This gives stable early context for short/medium sessions,
  # but in long-running sessions that rely on rolling compaction the pinned
  # opening turns may not match how you want the session framed over time.
  # Set to 0 to preserve ONLY the system prompt (plus the rolling summary
  # and recent tail) — the cleanest configuration for long-running sessions.
  # Default 3 preserves the system prompt plus the first three non-system
  # head messages, matching the pre-feature behaviour.
  protect_first_n: 3

  # Idle compaction (default: 0 = disabled). When > 0, a session that resumes
  # after at least this many seconds of inactivity compacts its accumulated
  # history up front, before the first reply, so a long-lived thread you come
  # back to later doesn't re-read its full stale context on every turn.
  # Time-based, so it complements (does not replace) the size-based `threshold`
  # above. It is skipped when the context is already small (at or below the
  # post-compression target = threshold × target_ratio), so it never wastes a
  # summarization on a short idle thread. Example: 1800 = compact after 30 min idle.
  idle_compact_after_seconds: 0

  # Gateway session-hygiene turn-hold budget (default: 10). Max seconds an
  # arriving user turn is held while a still-streaming hygiene summary
  # finishes. Distinct from hygiene_timeout_seconds (compressor inactivity
  # budget): this bounds user-visible latency so chat transports (Telegram
  # ~30s) do not drop a silent connection. On expiry the turn proceeds
  # uncompressed; the detached worker keeps its commit admission (when the
  # commit is watermark-fenced) and the summary is adopted at the next safe
  # boundary. Thinking-model summarizers often need longer than 10s to emit
  # the first content token — raise to 300 (or >= your summarizer's real
  # time-to-first-content) only if you want THIS turn to wait for the
  # compression instead of adopting it one turn late.
  hygiene_max_turn_hold_seconds: 10

  # Proactive tool-result prune (default: 0 = disabled). Opt-in token trigger
  # for a deterministic, no-LLM prune of OLD tool-result payloads, run
  # independently of `threshold` above. On large-window models (512K/1M) the
  # ratio threshold rarely fires, so bulky tool outputs (terminal dumps, file
  # reads, web extracts) ride along in history and get re-billed every turn.
  # When re-sent history exceeds this many tokens, the prune dedupes identical
  # results, summarizes older oversized ones, and truncates large tool-call
  # arguments — protecting the most recent `protect_last_n` messages and never
  # calling the model. Try 48000 to enable. Built-in compressor engine only;
  # other context engines inherit a safe no-op.
  # NOTE: a committed prune rewrites already-sent history, which invalidates
  # the provider's prompt-cache prefix — the min_reclaim gate below keeps
  # those cache breaks episodic (like a compression boundary) instead of
  # per-turn.
  proactive_prune_tokens: 0

  # The prune's summarize pass only touches tool results larger than this many
  # characters (clamped to >= 200 so a generated summary can't be
  # re-summarized). Default 8000.
  proactive_prune_min_result_chars: 8000

  # A proactive prune only COMMITS when it reclaims at least this many tokens
  # (measured on the pruned output). This is the prompt-cache hysteresis gate:
  # one meaningful, amortized cache break per batch of stale tool output
  # instead of a tiny break on every tool iteration. 0 = commit any non-zero
  # prune. Default 4096.
  proactive_prune_min_reclaim_tokens: 4096

 
#
prompt_caching:
  cache_ttl: "5m" # use "1h" for long sessions with pauses between turns

#
memory:
  # Agent's personal notes: environment facts, conventions, things learned
  memory_enabled: true

  # User profile: preferences, communication style, expectations
  user_profile_enabled: true

  # Character limits (~2.75 chars per token, model-independent)
  memory_char_limit: 2200   # ~800 tokens
  user_char_limit: 1375     # ~500 tokens

  # Periodic memory nudge: remind the agent to consider saving memories
  # every N user turns. Set to 0 to disable. Only active when memory is enabled.
  nudge_interval: 10        # Nudge every 10 user turns (0 = disabled)

# =============================================================================
# Session Continuity (Messaging Platforms)
# =============================================================================
# Conversations persist across inactivity and daily boundaries. Use /new or
# /reset explicitly; context compression manages long conversations.

# Maximum number of simultaneously active chat sessions across CLI, TUI,
# dashboard chat, and messaging gateway. Set to null, 0, or omit to allow
# unlimited concurrent sessions. When the limit is reached, new sessions get a
# clean error while existing active sessions keep their normal behavior. This
# top-level key takes precedence over gateway.max_concurrent_sessions. The cap
# is a best-effort single-host/profile runtime guard; Hermes fails open if the
# local runtime lease registry cannot be read or locked.
max_concurrent_sessions:

# When true, group/channel chats use one session per participant when the platform
# provides a user ID. This is the secure default and prevents users in the same
# room from sharing context, interrupts, and token costs. Set false only if you
# explicitly want one shared "room brain" per group/channel.
group_sessions_per_user: true

streaming:
  enabled: false
  # transport: edit           # "edit" = progressive editMessageText
  # edit_interval: 0.3        # seconds between message edits
  # buffer_threshold: 40      # chars before forcing an edit flush
  # cursor: " ▉"              # cursor shown during streaming

# =============================================================================
# Skills Configuration
# =============================================================================
# Skills are reusable procedures the agent can load and follow. The agent can
# also create new skills after completing complex tasks.
#
skills:
  # Nudge the agent to create skills after complex tasks.
  # Every N tool-calling iterations, remind the model to consider saving a skill.
  # Set to 0 to disable.
  creation_nudge_interval: 15

  # External skill directories — share skills across tools/agents without
  # copying them into ~/.hermes/skills/.  Each path is expanded (~ and ${VAR})
  # and resolved to an absolute path.  External dirs are read-only: skill
  # creation always writes to ~/.hermes/skills/.  Local skills take precedence
  # when names collide.
  # external_dirs:
  #   - ~/.agents/skills
  #   - /home/shared/team-skills

# =============================================================================
# Agent Behavior
# =============================================================================
agent:
  # Maximum tool-calling iterations per conversation (default: 500)
  # Higher = more room for complex tasks, but costs more tokens
  # Recommended: 20-30 for focused tasks, 50-100 for open exploration
  max_turns: 10
  budget_warning_ratio: 0.7
  tool_use_enforcement: true
  execution_guidance: true

  # Enable verbose logging
  verbose: false

  # Reasoning effort level (OpenRouter and Nous Portal)
  # Controls how much "thinking" the model does before responding.
  # Options: "xhigh" (max), "high", "medium", "low", "minimal", "none" (disable)
  # Providers with bespoke thinking tiers (a relay serving fast/thinking): use the
  # dict form and the level is sent verbatim. Bare strings stay strict (typo guard).
  #   reasoning_effort:
  #     enabled: true
  #     effort: thinking
  reasoning_effort: "low"

  service_tier: ""
  fast_auto_seconds: 60

  # Custom personalities (use with /personality command).
  # Built-ins (helpful, concise, technical, creative, teacher, kawaii, catgirl,
  # pirate, shakespeare, surfer, noir, uwu, philosopher, hype) are always
  # available on every surface — defined once in hermes_cli/personality.py.
  # Entries here ADD new personalities or OVERRIDE a built-in by name.
  # The active selection is stored in display.personality (never here, and
  # never in agent.system_prompt — that field is your manual system prompt).
  personalities: {}
  #   mentor: "You are a supportive mentor. Guide, don't lecture."
  #   reviewer:
  #     system_prompt: "You are a meticulous code reviewer."
  #     tone: "direct"
  #     style: "terse"

# =============================================================================
# Gateway Lifecycle
# =============================================================================
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
  
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]
  whatsapp: [hermes-whatsapp]
  slack: [hermes-slack]
  signal: [hermes-signal]
  homeassistant: [hermes-homeassistant]
  qqbot: [hermes-qqbot]
  yuanbao: [hermes-yuanbao]
  teams: [hermes-teams]
  google_chat: [hermes-google_chat]

stt:
  enabled: true
 
  local:
    model: "base"              # tiny | base | small | medium | large-v3 | turbo
    # language: ""             # auto-detect; set to "en", "es", "fr", etc. to force
    # initial_prompt: ""       # Optional faster-whisper prompt, e.g. bias Chinese output to simplified Chinese
    # --- Anti-hallucination hardening (whisper decodes junk from silence without these) ---
    # vad: true                # Silero VAD filter (default on) — silence never reaches whisper.
    #                          # Set false to restore raw behavior (e.g. transcribing music/ambient audio).
    # vad_min_silence_ms: 500  # min silence (ms) that splits speech chunks when vad is on
    # no_speech_prob_threshold: 0.6  # drop a segment only if no_speech_prob > this...
    # logprob_threshold: -1.0       # ...AND avg_logprob < this (both must hit — quiet real speech survives)
    # unload_after_idle_seconds: 0  # 0=never unload (default); e.g. 300 releases the model after 5min idle (frees VRAM on GPU; next voice message reloads it)
  language: "en"               # GLOBAL language hint for every STT provider (per-provider language wins). Set "" for auto-detect.
  # groq:
  #   model: "whisper-large-v3-turbo"
  #   language: ""             # blank = stt.language > HERMES_LOCAL_STT_LANGUAGE > auto-detect
  openai:
    model: "whisper-1"         # whisper-1 | gpt-4o-mini-transcribe | gpt-4o-transcribe | gpt-transcribe
    language: ""               # auto-detect; set to "en", "es", "fr", etc. to force
    timeout: 60                # request timeout in seconds; increase for self-hosted model cold starts
    max_retries: 1             # OpenAI SDK transport retries; set 0 to disable

# Intermediate tool results stay out of the LLM's context window.
code_execution:
  timeout: 180         # Max seconds per script before kill (default: 300 = 5 min)
  max_tool_calls: 10   # Max RPC tool calls per execution (default: 50)
  # Local execution uses a persistent session kernel: variables, imports, and
  # loaded data survive across execute_code calls in one conversation, so
  # multi-step data work stops re-loading its inputs every call. Pass
  # reset=true on a call to discard state; a timed-out/interrupted cell kills
  # the kernel (next call starts fresh). Remote terminal backends currently
  # run per-call (remote kernel host is tracked follow-up work). Security
  # scrubbing, tool whitelist, and output redaction are identical either way.
  # kernel_idle_timeout: 1800   # Reap kernels idle longer than this (seconds)
  # max_session_kernels: 4      # Process-wide LRU cap on live kernels

# =============================================================================
# Subagent Delegation
# =============================================================================
# The delegate_task tool spawns child agents with isolated context.
# Supports single tasks and batch mode (default 3 parallel, configurable).
delegation:
  max_iterations: 250                         # Max tool-calling turns per child (default: 250)

display:
  # Use compact banner mode (hides the ASCII-art banner, shows a single line).
  #   true:  Compact single-line banner
  #   false: Full ASCII banner with tool/skill summary (default)
  compact: false


  cleanup_progress: false


  suppress_warning_notifications: false


  busy_input_mode: interrupt

  # Background process notifications (gateway/messaging only).
  # Controls how chatty the process watcher is when you use
  # terminal(background=true, notify_on_complete=true) from Telegram/Discord/etc.
  #   concise: One-line status message on completion; failures include a short
  #            output tail (default)
  #   off:     No watcher messages at all
  #   result:  Only the final raw-output completion message
  #   error:   Only the final raw-output message when exit code != 0
  #   all:     Running output updates + final raw-output message
  background_process_notifications: concise


  # Play terminal bell when agent finishes a response.
  # Useful for long-running tasks — your terminal will ding when the agent is done.
  # Works over SSH. Most terminals can be configured to flash the taskbar or play a sound.
  #   true:  Ring the terminal bell on each response
  #   false: Silent (default)
  bell_on_complete: false

  # Play terminal bell when a blocking prompt opens and waits on you:
  # clarify questions, dangerous-command approvals, sudo password, secret
  # capture. Same mechanism as bell_on_complete (\a) — works over SSH.
  #   true:  Ring whenever the agent is waiting for your input
  #   false: Silent (default)
  bell_on_prompt: false


  skin: default

telemetry:
  shared_metrics:
    enabled: false
    send: false
    # endpoint: https://telemetry.nousresearch.com/v1/telemetry


# =============================================================================
# Login Policy (credentials themselves live in auth.json / .env)
# =============================================================================
    offer_version: 2
auth:
  # Borrow and refresh the Codex CLI (~/.codex/auth.json) and Claude Code logins when Hermes has
  # no usable login of its own. Their refresh tokens are single-use, so two programs on one login
  # can log each other out; set false to make Hermes use only its own logins.
  adopt_external_logins: true
  # How `hermes auth add openai-codex` / `hermes model` sign in to OpenAI Codex.
  #   device_code (default) — open a URL and enter a code.
  #   browser — authorization-code + PKCE on http://localhost:1455/auth/callback (the redirect
  #             OpenAI registered for the Codex client) for organizations that disable the
  #             device-code grant; falls back to device code when that port is busy.
  # `hermes auth add openai-codex --browser` opts in for a single login without changing this.
  codex_login_flow: device_code


# =============================================================================
# Update Behavior
# =============================================================================
updates:
  # Disable passive CLI/banner update checks with `hermes config set updates.check false`.
  # Explicit `hermes update --check` and `hermes update` remain available.
  check: true
  # Create a full HERMES_HOME zip before every `hermes update`.
  # Backups land in ~/.hermes/backups/ and can be restored with `hermes import`.
  # Off by default because large homes can add minutes to every update.
  pre_update_backup: false

  # Number of pre-update backup zips to retain.
  backup_keep: 5

  # What non-interactive updates do with local source edits in the Hermes repo.
  # Interactive terminal updates always prompt before restoring the autostash.
  #
  #   stash   - auto-stash before pull, then auto-restore after success (default)
  #   discard - drop the update-created stash after success; use only on managed
  #             installs where local source edits should not persist
  non_interactive_local_changes: "stash"

approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny

hooks:
  pre_tool_call:
    - matcher: "write_file|patch|terminal|execute_code"
      command: "C:/Users/fjun2024/AppData/Local/hermes/profiles/glpred2/hooks/require-file-approval.py"
      timeout: 10
      fail_closed: true

hooks_auto_accept: false